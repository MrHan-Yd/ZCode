name: Release Desktop

# 触发方式：
#   1) push 形如 v3.14.3 的 tag —— 常规发行路径
#   2) 手动 workflow_dispatch，传入一个已存在的 tag —— 重新打包或重跑失败任务
#
# 推 tag 即公开发布 Release 并附上安装包，无需人工确认。
# 两个平台的安装包都是未签名构建，macOS 首次打开需按 README 清除 quarantine 属性；
# 需要先人工验证产物再公开时，把创建 Release 步骤的 draft 改回 true。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag（例如 v3.14.3）"
        required: true
        type: string

# 创建 Release 并上传产物需要写权限
permissions:
  contents: write

# 同一 tag 同时只跑一条流水线；后续 tag 不受影响。不取消进行中的构建，
# 避免半途中断留下不完整的 Release 产物。
concurrency:
  group: release-desktop-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # 发行身份的硬前提：不设置时 resolveBuiltinProviderBuildEnvironment 会 fail-safe 成 test，
  # 产物会变成 Preview 身份、文件名带 _TEST 后缀并指向测试后端。
  ZCODE_ENV: production
  # Runner 在境外，改用官方源下载 Electron 与 electron-builder 辅助工具，
  # 覆盖仓库内默认的 npmmirror。取值与 scripts/spawn 侧解析的镜像语义一致。
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
  # 未签名发行：阻止 electron-builder 在 CI 上自动探测钥匙串里的证书。
  # 需要签名时再补 APPLE_SIGNING_IDENTITY / CSC_LINK 并显式打开 ZCODE_ENABLE_MAC_SIGN。
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  # 根 prepare 脚本会安装 git hooks，CI 不需要
  HUSKY: "0"

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    strategy:
      # 一个平台失败不应连坐另一个平台，否则两个包都要重跑
      fail-fast: false
      matrix:
        include:
          - label: Windows x64 (nsis)
            runner: windows-latest
            targetOs: win
            targetArch: x64
            # Windows 安装包不依赖 mock-cdn 远程资产，跳过可省掉跨平台资源准备时间
            skipRemoteAssets: "1"
            distPatterns: |-
              packages/desktop/dist/*.exe
              packages/desktop/dist/*.exe.blockmap
              packages/desktop/dist/latest.yml
          - label: macOS arm64 (dmg + zip)
            # macos-15 连续因 arm64 容量不足无法分配 runner；改用同架构的标准 macos-26。
            # 不使用付费 large/xlarge runner；手动重跑仍检出原发行标签，不改产品源码。
            runner: macos-26
            targetOs: mac
            targetArch: arm64
            # macOS 包需要远程工作区资源，保持默认的 prepare:remote-assets
            skipRemoteAssets: "0"
            distPatterns: |-
              packages/desktop/dist/*.dmg
              packages/desktop/dist/*.zip
              packages/desktop/dist/*.dmg.blockmap
              packages/desktop/dist/*.zip.blockmap
              packages/desktop/dist/latest-mac.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # 手动重跑使用新工作流定义，但产品源码仍严格来自输入的发行标签。
          ref: ${{ github.event.inputs.tag || github.ref }}
          # build-metadata 会执行 git rev-parse 写入产物；完整历史便于回溯
          fetch-depth: 0

      - name: 校验 tag 与 package.json 版本一致
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "tag=${RELEASE_TAG} package.json=${version}"
          if [ "${RELEASE_TAG}" != "v${version}" ]; then
            echo "::error::tag 与 package.json 版本不一致，安装包内的版本号取自 package.json，继续打包会产出名不副实的发行物。请把 package.json 版本改成 ${RELEASE_TAG#v} 后重新打 tag。"
            exit 1
          fi

      - name: 准备 Windows PowerShell 模块环境
        id: windows-powershell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # pwsh 继承的模块目录会让 Windows PowerShell 加载不兼容的 Archive/.NET 重载。
          $env:PSModulePath = Join-Path $PSHOME 'Modules'
          Import-Module Microsoft.PowerShell.Archive -ErrorAction Stop
          "PSModulePath=$env:PSModulePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 发行环境回归
        id: release-regressions
        # 在真实打包前验证发行环境与仓库内原生工具归档，避免再次把问题拖到
        # bootstrap/electron-builder 阶段才暴露。重打不含该入口的旧标签时只记录跳过，
        # 不能用 main 的脚本覆盖旧标签源码。
        run: |
          # 退出码 3 专门表示“旧标签没有 test:release 入口”；其他非零一律失败，
          # 避免脚本求值异常被当成旧标签静默跳过。
          set +e
          node -e "process.exit(require('./package.json').scripts?.['test:release'] ? 0 : 3)"
          status=$?
          set -e
          if [ "${status}" -eq 0 ]; then
            pnpm test:release
          elif [ "${status}" -eq 3 ]; then
            echo "::notice::该发行标签未包含 test:release 入口，跳过发行环境回归。"
          else
            echo "::error::检测 test:release 入口失败（退出码 ${status}），请检查 package.json。"
            exit "${status}"
          fi

      - name: 初始化（准备桌面运行资源 + 构建各 workspace 包）
        # 等价于 README 的 pnpm bootstrap：submodule 检查、依赖安装、
        # prepare:desktop-runtime，最后跑 build:bootstrap
        run: node scripts/bootstrap.mjs

      - name: 打包 ${{ matrix.targetOs }}/${{ matrix.targetArch }}
        # bundle:desktop 内部依次执行 prepare:runtime-assets → 桌面构建 →
        # electron-builder → 产物依赖校验 → 体积审计，任一环节失败都会让 job 失败
        env:
          ZCODE_SKIP_REMOTE_ASSETS: ${{ matrix.skipRemoteAssets }}
        run: pnpm bundle:desktop -- --os ${{ matrix.targetOs }} --arch ${{ matrix.targetArch }}

      - name: 列出产物
        shell: bash
        run: ls -lh packages/desktop/dist/ || true

      - name: 上传产物
        uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-${{ matrix.targetOs }}-${{ matrix.targetArch }}
          path: ${{ matrix.distPatterns }}
          # 安装包是这一步的唯一目的，缺文件必须显式失败而不是静默产出空 artifact
          if-no-files-found: error
          retention-days: 14

  release:
    name: 创建 Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 发布 job 不继承 build job 的检出，但下面的强更标记要从仓库根读取；
      # 少了这一步 cp force-update.json 会在空工作区里失败，两个平台的包白打一遍且不产出 Release。
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 下载全部平台产物
        uses: actions/download-artifact@v8.0.2
        with:
          path: release-assets
          merge-multiple: true

      - name: 列出发布文件
        run: ls -lh release-assets/

      - name: 准备强制升级标记
        # 客户端的启动强更门禁读 /releases/latest/download/force-update.json。
        # 声明放在仓库根 force-update.json，这里复制一份进 Release，
        # 保证每个正式版都带着当前声明，不会因为某次发版漏传而让门禁静默失效。
        run: cp force-update.json release-assets/force-update.json

      - name: 创建 Release 并附加安装包
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ZCode ${{ github.event.inputs.tag || github.ref_name }}
          # 推 tag 直接公开。安装包未签名，若要先人工验证再公开，改回 draft: true。
          draft: false
          # 客户端的「检查更新」直接读 Release 里的 latest*.yml，*.blockmap 供差分下载。
          # 漏发 latest*.yml 会让更新检查报 ERR_UPDATER_CHANNEL_FILE_NOT_FOUND。
          # latest*.yml 里的下载地址由客户端按 tag + 文件名重建，与发版地址无关。
          files: |
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/latest.yml
            release-assets/latest-mac.yml
            release-assets/*.blockmap
            release-assets/force-update.json
          fail_on_unmatched_files: true
